services:
  campus-forum:
    build: .
    container_name: campus-forum
    ports:
      - "8787:8787"
    environment:
      # Quick-start defaults are for local demos. Set false after changing/disabling demo accounts.
      ALLOW_DEMO_CREDENTIALS: ${ALLOW_DEMO_CREDENTIALS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CAMPUS_NAME: ${CAMPUS_NAME:-知行大学}
      CAMPUS_EMAIL_DOMAINS: ${CAMPUS_EMAIL_DOMAINS:-edu.cn}
      VERIFICATION_WEBHOOK_URL: ${VERIFICATION_WEBHOOK_URL:-}
      VERIFICATION_WEBHOOK_TOKEN: ${VERIFICATION_WEBHOOK_TOKEN:-}
      LLM_MODERATION_URL: ${LLM_MODERATION_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
